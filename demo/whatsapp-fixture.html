<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Copilot — isolated test conversation</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; color:#1b3430; background:#f2f5f1; font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .fixture-banner { height:34px; padding:7px 24px; background:#174f43; color:#fff; font-size:12px; letter-spacing:.02em; }
    .layout { display:grid; grid-template-columns:290px 1fr; height:calc(100vh - 34px); }
    aside { padding:26px 18px; background:#fff; border-right:1px solid #dde5df; }
    aside h1 { margin:0 0 6px; font-size:24px; letter-spacing:-.8px; }
    aside p { color:#718078; font-size:12px; margin-bottom:26px; }
    .contact { display:flex; width:100%; gap:12px; align-items:center; text-align:left; padding:16px 12px; margin:5px 0; border:0; border-radius:12px; background:#f4f7f3; cursor:pointer; color:inherit; }
    .contact strong { display:block; font-size:14px; }
    .contact small { color:#6a7a72; font-size:11px; }
    .avatar { display:grid; place-items:center; width:42px; height:42px; border-radius:50%; background:#d5e9db; font-size:14px; font-weight:650; }
    #main { position:relative; display:flex; flex-direction:column; min-width:0; height:100%; background:linear-gradient(135deg,#ecf0e9,#e7ede6); }
    header { display:flex; align-items:center; gap:14px; height:78px; padding:16px 30px; background:#f9fbf8; border-bottom:1px solid #dde5df; }
    header strong { display:block; font-size:16px; }
    header small { color:#7a8980; font-size:12px; }
    .messages { padding:38px 7% 24px; flex:1; overflow:auto; }
    .day { text-align:center; font-size:11px; color:#708174; margin-bottom:30px; }
    .row { display:flex; margin:12px 0; }
    .row.out { justify-content:flex-end; }
    .message-in,.message-out { max-width:480px; padding:14px 17px 9px; border-radius:0 14px 14px 14px; background:#fff; box-shadow:0 2px 3px #183b2110; }
    .message-out { background:#d8edcb; border-radius:14px 0 14px 14px; }
    .stamp { display:block; text-align:right; color:#7d8a80; font-size:10px; margin-top:6px; }
    footer { display:flex; align-items:center; gap:14px; min-height:92px; padding:19px 28px; background:#f6f8f4; }
    [contenteditable] { flex:1; min-height:50px; background:#fff; border:1px solid #dde6dc; border-radius:12px; padding:13px 18px; outline:none; }
    [contenteditable]:focus { border-color:#87ae8d; }
    #send { border:0; border-radius:50%; background:#176c50; color:white; width:44px; height:44px; font-size:22px; cursor:pointer; }
    .fixture-controls { position:fixed; left:18px; bottom:20px; width:250px; font-size:11px; color:#718078; }
    .fixture-controls button { border:1px solid #d6e1d8; border-radius:8px; background:#fff; color:#345e47; padding:8px; margin-right:4px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="fixture-banner">TEST FIXTURE · fictional messages · no WhatsApp connection · no messages can be sent</div>
  <div class="layout">
    <aside>
      <h1>Chats</h1>
      <p>A local conversation for testing the extension.</p>
      <button class="contact" data-contact="a"><span class="avatar">AR</span><span><strong>Alex Rao</strong><small>Product team · contact A</small></span></button>
      <button class="contact" data-contact="b"><span class="avatar">AR</span><span><strong>Alex Rao</strong><small>Weekend plans · contact B</small></span></button>
      <div class="fixture-controls">
        <p>These contacts intentionally share a name. Their conversation IDs are different.</p>
        <button id="set-draft">Reset draft</button><button id="missing-id">Remove chat IDs</button>
      </div>
    </aside>
    <main id="main">
      <header><span class="avatar">AR</span><div><strong><span title="Alex Rao" data-testid="conversation-info-header-chat-title">Alex Rao</span></strong><small>online</small></div></header>
      <section class="messages" aria-label="Conversation"></section>
      <footer><div role="textbox" aria-label="Type a message" title="Type a message" contenteditable="true" data-tab="10" data-testid="conversation-compose-box-input"></div><button id="send" aria-label="Send">➤</button></footer>
    </main>
  </div>
  <script src="fixture.js"></script>
</body>
</html>
