<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Threadlight · Local setup</title><link rel="stylesheet" href="/setup.css"><script src="/setup.js" defer></script></head><body><main><header><h1>Threadlight setup</h1><a class="button secondary" href="https://platform.openai.com/api-keys" target="_blank" rel="noopener noreferrer">Get an API key ↗</a></header><section class="setup-grid" aria-label="Local setup"><article class="card"><div class="card-heading"><h2>OpenAI</h2><span class="status" id="status">Checking connection</span></div><form id="setup-form"><label for="api-key">OpenAI API key</label><div class="field-with-button"><input id="api-key" name="apiKey" type="password" autocomplete="new-password" placeholder="sk-…" spellcheck="false"><button type="button" id="toggle-key" class="subtle">Show</button></div><p class="hint" id="key-hint"></p><details><summary>Models</summary><div class="model-fields"><label for="model">Writing model</label><input id="model" value="gpt-5-mini" spellcheck="false"><label for="transcription">Transcription model</label><input id="transcription" value="gpt-transcribe" spellcheck="false"></div></details><div class="actions"><button type="submit" class="button" id="save">Save connection</button><button type="button" class="text-button" id="clear-key" hidden>Remove saved key</button></div></form><div id="notice" role="status" aria-live="polite"></div></article><article class="card"><div class="card-heading"><h2>Browser extension</h2></div><label for="pairing-token">Pairing token</label><div class="field-with-button"><input id="pairing-token" type="password" readonly aria-label="Private pairing token"><button type="button" class="subtle" id="copy-token" aria-label="Copy pairing token">Copy</button></div><div class="actions"><button class="text-button" id="rotate-token" type="button" title="Existing extensions will need the new token">Replace pairing token</button></div><div id="pair-notice" role="status" aria-live="polite"></div><p class="hint" id="media-status"></p></article></section></main></body></html>
